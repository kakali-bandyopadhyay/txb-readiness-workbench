<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Release register · Readiness Workbench</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main><p class="eyebrow">A transaction bank (synthetic)</p><h1>Release register</h1><p class="lede">Illustrative launch readiness for a synthetic transaction banking feature.</p><section class="panel"><form method="get" action="/" class="filters"><label>Lifecycle status<select name="status"><option value="">All</option><option value="IN_READINESS" th:selected="${status == 'IN_READINESS'}">In readiness</option><option value="LIVE" th:selected="${status == 'LIVE'}">Live</option></select></label><label>Region<select name="region"><option value="">All regions</option><option th:each="r:${regions}" th:value="${r}" th:text="${r}" th:selected="${region == r}"></option></select></label><label>Target date from<input type="date" name="from"></label><label>Target date to<input type="date" name="to"></label><button>Apply filters</button></form></section><div class="table-wrap"><table><thead><tr><th>Release</th><th>Target date</th><th>Regions</th><th>Lifecycle</th><th>Owner</th><th>Readiness</th></tr></thead><tbody><tr th:each="r:${releases}"><td><a th:href="@{'/releases/'+${r.id}}" th:text="${r.name}"></a><small th:text="${r.changeSummary}"></small></td><td th:text="${r.targetDate}"></td><td th:text="${r.regions}"></td><td><span class="badge" th:text="${r.lifecycleStatus}"></span></td><td th:text="${r.owner}"></td><td><a th:href="@{'/releases/'+${r.id}+'/dashboard'}">Dashboard →</a></td></tr></tbody></table></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
