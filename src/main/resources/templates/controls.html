<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Control reviews · Readiness Workbench</title><link rel="stylesheet" href="/css/app.css"></head><body><header th:replace="~{fragments :: nav}"></header><main><a th:href="@{'/releases/'+${release.id}}">← Release workspace</a><p class="eyebrow">Control reviews · synthetic</p><h1 th:text="${release.name}"></h1><nav class="tabs"><a th:href="@{'/releases/'+${release.id}}">Readiness</a><a th:href="@{'/releases/'+${release.id}+'/uat'}">UAT workbench</a><a class="selected" th:href="@{'/releases/'+${release.id}+'/controls'}">Controls</a><a th:href="@{'/releases/'+${release.id}+'/decision'}">Decision</a><a th:href="@{'/releases/'+${release.id}+'/dashboard'}">Executive dashboard</a></nav><div class="table-wrap"><table><thead><tr><th>Control</th><th>Required change</th><th>Reviewer</th><th>Status</th><th>Evidence</th><th>Sign-off</th></tr></thead><tbody><tr th:each="c:${controls}"><td th:text="${c.controlName}"></td><td th:text="${c.requiredChange}"></td><td th:text="${c.reviewer}"></td><td th:text="${c.status}"></td><td th:text="${c.evidenceReference == null ? 'Pending' : c.evidenceReference}"></td><td><form th:if="${c.status != 'SIGNED_OFF'}" th:action="@{'/controls/'+${c.id}+'/signoff'}" method="post"><button>Sign off</button></form><span th:if="${c.status == 'SIGNED_OFF'}" th:text="${c.signedOffBy}"></span></td></tr></tbody></table></div><p class="callout">Only the control partner role can sign off a review. All records shown are synthetic.</p></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
