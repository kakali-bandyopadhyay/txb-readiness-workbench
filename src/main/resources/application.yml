spring:
  application:
    name: readiness-workbench
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/readiness}
    username: ${SPRING_DATASOURCE_USERNAME:readiness}
    password: ${SPRING_DATASOURCE_PASSWORD:readiness_demo_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: readiness-workbench
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  thymeleaf:
    cache: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /api/docs
server:
  error:
    include-message: always
demo:
  events:
    enabled: ${DEMO_EVENTS_ENABLED:false}
    retention:
      max-records: ${DEMO_EVENTS_MAX_RECORDS:500}
    interval-ms: ${DEMO_EVENTS_INTERVAL_MS:1000}
